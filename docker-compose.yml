version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Databases ──────────────────────────────────────────────────────────────

  users-db:
    image: postgres:16-alpine
    container_name: users-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: users_db
    ports:
      - "5432:5432"
    volumes:
      - users_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d users_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  todos-db:
    image: postgres:16-alpine
    container_name: todos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: todos_db
    ports:
      - "5433:5432"
    volumes:
      - todos_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d todos_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  comments-db:
    image: postgres:16-alpine
    container_name: comments-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: comments_db
    ports:
      - "5434:5432"
    volumes:
      - comments_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d comments_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  comments-fastapi-db:
    image: postgres:16-alpine
    container_name: comments-fastapi-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: comments_fastapi_db
    ports:
      - "5435:5432"
    volumes:
      - comments_fastapi_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d comments_fastapi_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend Microservices ──────────────────────────────────────────────────

  users-service:
    build:
      context: .
      dockerfile: backend/apps/users-service/Dockerfile
    container_name: users-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@users-db:5432/users_db
      SECRET_KEY: ${SECRET_KEY:-super-secret-change-in-production}
      DEBUG: "false"
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
      users-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  todos-service:
    build:
      context: .
      dockerfile: backend/apps/todos-service/Dockerfile
    container_name: todos-service
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@todos-db:5432/todos_db
      USERS_SERVICE_URL: http://users-service:8001
      DEBUG: "false"
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
      todos-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  comments-service-fastapi:
    build:
      context: .
      dockerfile: backend/apps/comments-service-fastapi/Dockerfile
    container_name: comments-service-fastapi
    restart: unless-stopped
    ports:
      - "8004:8004"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@comments-fastapi-db:5432/comments_fastapi_db
      SECRET_KEY: ${SECRET_KEY:-super-secret-change-in-production}
      REDIS_URL: redis://redis:6379
      DEBUG: "false"
    depends_on:
      redis:
        condition: service_healthy
      comments-fastapi-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  comments-service:
    build:
      context: ./backend/apps/comments-service
      dockerfile: Dockerfile
    container_name: comments-service
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      DATABASE_URL: postgres://postgres:postgres@comments-db:5432/comments_db
      SECRET_KEY: ${SECRET_KEY:-super-secret-change-in-production}
      DEBUG: "false"
      USERS_SERVICE_URL: http://users-service:8001
      TODOS_SERVICE_URL: http://todos-service:8002
    depends_on:
      comments-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Frontend ───────────────────────────────────────────────────────────────

  frontend:
    build:
      context: .
      dockerfile: ./frontend/apps/frontend/Dockerfile
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - users-service
      - todos-service
      - comments-service

volumes:
  users_db_data:
  todos_db_data:
  comments_db_data:
  comments_fastapi_db_data:
